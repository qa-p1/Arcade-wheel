# Creates an annotated release-candidate tag (vX.Y.Z-rc.N) on a commit that is already on main, after checking it
# matches the app version, then starts "Release" on it, which builds every platform once and publishes a hidden
# prerelease on the test channel. Stable is never tagged here: "Promote" makes vX.Y.Z from a verified rc.
name: Tag a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate to create, e.g. v1.0.0-rc.1
        required: true
      sha:
        description: Full SHA of a commit on main
        required: true
permissions:
  contents: write
  actions: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[1-9][0-9]*$ ]] || { echo "::error::tag must look like v1.2.3-rc.1"; exit 1; }
          base="${BASH_REMATCH[1]}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          v=$(git show "$SHA:CMakeLists.txt" | sed -nE 's/^project\(ArcadeWheel VERSION ([^ ]+).*/\1/p')
          [ "$v" = "$base" ] || { echo "::error::version at $SHA is $v, not $base"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Arcade Wheel ${TAG#v}" -m "See CHANGELOG.md."
          git push origin "refs/tags/$TAG"
      - name: Build and publish it on the test channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
