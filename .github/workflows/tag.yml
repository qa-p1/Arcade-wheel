# Creates an annotated version tag on a commit that is already on main, after
# checking it matches the app version. The order: Release (beta, draft) on main
# as the rehearsal, then this workflow, then Release (stable) on the new tag.
name: Tag a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0
        required: true
      sha:
        description: Full SHA of a commit on main
        required: true
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          v=$(git show "$SHA:CMakeLists.txt" | sed -nE 's/^project\(ArcadeWheel VERSION ([^ ]+).*/\1/p')
          [ "$v" = "${TAG#v}" ] || { echo "version at $SHA is $v, not ${TAG#v}"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Arcade Wheel ${TAG#v}" -m "See CHANGELOG.md."
          git push origin "refs/tags/$TAG"
