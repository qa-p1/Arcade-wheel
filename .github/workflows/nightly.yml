# Nightly: main CI's already-tested packages (artifacts ArcadeWheel-*) as a signed prerelease
# vX.Y.Z-nightly.YYYYMMDD.N, with no rebuild. Skipped when main hasn't changed or its CI isn't green.
name: Nightly
on:
  schedule: [{ cron: "19 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: v
        run: echo "version=$(sed -nE 's/^project\(ArcadeWheel VERSION ([^ ]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
  nightly:
    needs: version
    uses: qa-p1/Arcade-Link/.github/workflows/app-nightly.yml@v1.0.8
    with:
      app: arcade.wheel
      version: ${{ needs.version.outputs.version }}
      artifacts: ArcadeWheel-*
      windows-installer: inno
      link-ref: v1.0.8
    secrets:
      ARCADE_UPDATE_SIGNING_KEY: ${{ secrets.ARCADE_UPDATE_SIGNING_KEY }}
